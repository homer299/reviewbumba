{% extends "user_experience/base.html" %}
{% load static %}

{% block title %}
    <title>User Account Profile</title>
{% endblock title %}

{% block content %}

<p>Email</p>
{%  if is_self %}
    <h5>{{email}}</h5>
    <a href="{% url 'password_change' %}">Change password</a>
    <a href="{% url 'update_user_account' user_id=id %}">Update User Account</a>
{% else %}
    <h5>**********</h5>
{% endif %}

<p>Username</p>
<h5>{{username}}</h5>

{% endblock content %}
